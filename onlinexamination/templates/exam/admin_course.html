{% extends 'exam/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <link href="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
    <style type="text/css">
     <style>
/* Page Background */
body {
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  font-family: 'Segoe UI', sans-serif;
}

/* Remove underline */
a:link {
  text-decoration: none;
}

/* Card Styling */
.order-card {
  color: #fff;
  border-radius: 15px;
  transition: all 0.4s ease-in-out;
  position: relative;
  overflow: hidden;
}

/* Gradient Card Colors */
.bg-c-blue {
  background: linear-gradient(45deg, #00c6ff, #0072ff);
}

.bg-c-gtx {
  background: linear-gradient(45deg, #1d976c, #93f9b9);
}

/* Card Shadow */
.card {
  border: none;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}

/* Hover Animation */
.order-card:hover {
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}

/* Card Content */
.card .card-block {
  padding: 35px;
}

/* Icon Animation */
.order-card i {
  font-size: 40px;
  transition: transform 0.5s ease;
}

/* Icon Rotate on Hover */
.order-card:hover i {
  transform: rotate(360deg);
}

/* Heading Styling */
h6 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 1px;
}

/* Smooth Fade-in Animation */
.container {
  animation: fadeIn 1s ease-in-out;
}

/* Keyframes */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive spacing */
header {
  left: 0px;
  right: 0px;
}
</style>
    
  </head>
<br><br>

  <div class="container">
    <div class="row">
      <div class="col-md-4 col-xl-6">
        <a href="admin-add-course" style="text-decoration: none;color:white;">
        <div class="card bg-c-blue order-card">
          <div class="card-block">
            <h6 class="m-b-20"> Add Course</h6>
            <h2 class="text-right"><i class="fas fa-plus f-left"></i></h2>
          </div>
        </div>
      </a>
      </div>
  
      <div class="col-md-4 col-xl-6">
        <a href="admin-view-course" style="text-decoration: none;color:white;">
        <div class="card bg-c-gtx order-card">
          <div class="card-block">
            <h6 class="m-b-20">View Course</h6>
            <h2 class="text-right"><i class="fas fa-eye f-left"></i></h2>
          </div>
        </div>
      </a>
      </div>
  
     
  
     
    </div>
  </div>


<br><br><br><br><br><br><br><br><br><br>

<script src="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"></script>


{% endblock content %}
